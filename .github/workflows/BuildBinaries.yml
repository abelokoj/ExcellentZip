name: Build ExcellentZip downloads
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: excellentzip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset-check dependency
        run: python -m pip install Pillow==11.1.0
      - name: Check icons and release versioning
        run: |
          python scripts/generate_icon_download.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_icon_assets.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_packaging.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test_source_layout.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer and portable ZIP
        run: ./scripts/Build-Release.ps1
      - name: Check native icons, default file types and zoom
        run: cmd /d /c scripts\test_icon_runtime.cmd
      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentZip-Windows-x64
          path: dist/*
          if-no-files-found: error
